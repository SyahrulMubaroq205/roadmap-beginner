<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cookie Consent Popup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="cookiePopup" class="cookie-popup hidden">
    <div class="cookie-popup-header">
      <div class="cookie-icon">🍪</div>
      <i id="closeBtn">&times;</i>
    </div>
    <div class="cookie-popup-message">
      We use cookies to improve your user experience.
    </div>
    <button id="acceptBtn" class="cookie-popup-button">I like Cookies</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
