<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tooltip Bubble</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="left-text">
      <p>CSS Only Tooltip to appear<br>above the item on hover.</p>
    </div>

    <div class="arrow">→</div>

    <div class="right-section">
      <div class="tooltip">
        <span>Here is everything I have built</span>
        <div class="tooltip-arrow"></div>
      </div>
      <div class="nav">
        <p>Home</p>
        <p class="spacer">·</p>
        <p class="highlight">Projects</p>
        <p class="spacer">·</p>
        <p>Blog</p>
      </div>
    </div>
  </div>
</body>
</html>
